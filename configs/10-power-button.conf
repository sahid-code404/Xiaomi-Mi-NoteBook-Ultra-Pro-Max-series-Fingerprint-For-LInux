# Managed configuration for Power Button handling on Xiaomi Mi NoteBook Ultra / Pro / Max
# Ensures proper delegation to desktop environment inhibitors (GNOME)
# and clean poweroff fallback when uninhibited (lock screen, TTY, display manager).
# HoldoffTimeoutSec=0 disables the default 30-second post-resume / post-boot ignore window
# so the power button responds immediately on every press without delays.

[Login]
HandlePowerKey=poweroff
HandlePowerKeyLongPress=poweroff
PowerKeyIgnoreInhibited=no
HoldoffTimeoutSec=0
